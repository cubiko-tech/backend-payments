# Refresh .env — Pull from Infisical and redeploy (no code changes).
name: Refresh Environment Variables

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - staging
          - production

permissions:
  contents: read
  id-token: write

env:
  SERVICE_PATH: /backend-payments
  IMAGE_VAR: BACKEND_PAYMENTS_IMAGE

jobs:
  refresh:
    name: Pull .env & Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}

    steps:
      # Hace falta por `deploy/refresh-env-remote.sh`, que se sube a la VM. El
      # workflow no tenía checkout porque su versión anterior llevaba el script
      # incrustado en el YAML — que es donde se le acumularon los bugs.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          MISSING=false
          for var in INFISICAL_URL INFISICAL_TOKEN \
                     INFISICAL_PROJECT_ID \
                     GCP_SERVICE_ACCOUNT_KEY GCP_PROJECT \
                     GCP_INSTANCE_NAME GCP_ZONE DEPLOY_PATH; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing secret: $var"
              MISSING=true
            fi
          done
          # `if`, NO `[ … ] && exit 1`. Esa forma era el ÚLTIMO comando del
          # script: con nada faltante el test da falso, devuelve 1 y `set -e`
          # se lleva puesto el paso entero. O sea que el job sólo podía tener
          # éxito encontrando un secreto faltante, y nunca refrescó nada.
          if [ "$MISSING" = "true" ]; then
            exit 1
          fi
        env:
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_INSTANCE_NAME: ${{ secrets.GCP_INSTANCE_NAME }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Resolve Infisical environment
        id: resolve
        run: |
          case "${{ inputs.environment }}" in
            develop)    echo "env=development" >> "$GITHUB_OUTPUT" ;;
            staging)    echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            production) echo "env=production" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pull .env from Infisical (/shared + service)
        env:
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INF_ENV: ${{ steps.resolve.outputs.env }}
        run: |
          set -euo pipefail

          fetch() {
            local path="$1"
            curl -sf -X GET \
              "${INFISICAL_URL}/api/v3/secrets/raw?environment=${INF_ENV}&workspaceId=${INFISICAL_PROJECT_ID}&secretPath=${path}&expandSecretReferences=true" \
              -H "Authorization: Bearer ${INFISICAL_TOKEN}" \
              || echo '{"secrets":[]}'
          }

          SHARED=$(fetch "/shared")
          SERVICE=$(fetch "${SERVICE_PATH}")

          SHARED_COUNT=$(echo "$SHARED" | jq '.secrets | length')
          SERVICE_COUNT=$(echo "$SERVICE" | jq '.secrets | length')
          TOTAL=$((SHARED_COUNT + SERVICE_COUNT))

          if [ "$TOTAL" = "0" ]; then
            echo "::error::No secrets in /shared nor ${SERVICE_PATH} (${INF_ENV})"
            exit 1
          fi

          {
            echo "# From Infisical (${INF_ENV})"
            echo "# /shared (${SHARED_COUNT}) + ${SERVICE_PATH} (${SERVICE_COUNT})"
            echo "# $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "$SHARED"  | jq -r '.secrets[] | "\(.secretKey)=\(.secretValue)"'
            echo "$SERVICE" | jq -r '.secrets[] | "\(.secretKey)=\(.secretValue)"'
          } > /tmp/service.env

          echo "Pulled $TOTAL variables ($SHARED_COUNT shared + $SERVICE_COUNT service)"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Upload .env and redeploy
        env:
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE_NAME }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          gcloud compute scp /tmp/service.env \
            "${GCP_INSTANCE}:/tmp/service.env" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --ssh-key-expire-after=1h

          gcloud compute scp deploy/refresh-env-remote.sh \
            "${GCP_INSTANCE}:/tmp/refresh-env-remote.sh" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --ssh-key-expire-after=1h

          gcloud compute ssh "$GCP_INSTANCE" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --ssh-key-expire-after=1h \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="sudo bash /tmp/refresh-env-remote.sh \
              '${DEPLOY_PATH}' /tmp/service.env '${IMAGE_VAR}' \
              && rm -f /tmp/refresh-env-remote.sh"

      # SIN `continue-on-error`: un refresco que deja el servicio caído tiene que
      # verse rojo. Con él puesto —y con el `[ -z … ] && exit 0` de abajo, que
      # mataba el paso apenas APP_URL estaba definida— este workflow reportaba
      # éxito pasara lo que pasara. Acepta production como input.
      - name: Health check
        timeout-minutes: 3
        run: |
          set -euo pipefail
          APP_URL="${{ secrets.APP_URL }}"
          # Mismo bug que en Validate secrets: con APP_URL definida el test da
          # falso, devuelve 1 y mata el paso — que además era
          # `continue-on-error`, así que el fallo se reportaba como éxito.
          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::APP_URL sin definir: no se puede verificar"
            exit 0
          fi
          sleep 30
          for i in 1 2 3; do
            curl -f -s --max-time 10 \
              "$APP_URL/health/ready" && exit 0
            sleep 10
          done
          echo "::warning::Health check failed"
