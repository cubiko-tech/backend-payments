# CI Fast — Lint + tests en PRs y feature branches.
name: CI - Fast Checks

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - 'feature/**'
      - 'task/**'
  pull_request:
    branches:
      - 'feature/**'
      - 'task/**'

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: '8.24.3'
      GITLEAKS_SHA256: '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d /tmp/gitleaks-install.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          tarball="${tmp_dir}/gitleaks.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download"
          url="${base_url}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -qO "$tarball" "$url"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$tmp_dir" gitleaks
          chmod 0755 "${tmp_dir}/gitleaks"
          target_dir="${GITLEAKS_INSTALL_DIR:-/usr/local/bin}"
          if [ -w "$target_dir" ]; then
            cp "${tmp_dir}/gitleaks" "${target_dir}/gitleaks"
          else
            sudo cp "${tmp_dir}/gitleaks" "${target_dir}/gitleaks"
          fi
          "${target_dir}/gitleaks" version

      - name: Scan secrets
        run: gitleaks git --log-opts="--full-history HEAD" --redact -v

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        continue-on-error: true
        run: ESLINT_USE_FLAT_CONFIG=false npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.24.3'
      GITLEAKS_SHA256: '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d /tmp/gitleaks-install.XXXXXX)"
          trap 'rm -rf "$tmp_dir"' EXIT
          tarball="${tmp_dir}/gitleaks.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download"
          url="${base_url}/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -qO "$tarball" "$url"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$tmp_dir" gitleaks
          chmod 0755 "${tmp_dir}/gitleaks"
          target_dir="${GITLEAKS_INSTALL_DIR:-/usr/local/bin}"
          if [ -w "$target_dir" ]; then
            cp "${tmp_dir}/gitleaks" "${target_dir}/gitleaks"
          else
            sudo cp "${tmp_dir}/gitleaks" "${target_dir}/gitleaks"
          fi
          "${target_dir}/gitleaks" version

      # `npm ci` y no `npm install`: instala EXACTO lo del lockfile, que es lo que
      # fija la versión del runner. Con `install`, el árbol de CI puede derivar del
      # que se probó en local.
      - name: Install dependencies
        run: npm ci

      # `npm test` usa el runner declarado en el repo. Antes acá decía
      # `npx jest --passWithNoTests`, que tenía dos agujeros: `npx` se bajaba un
      # runner sin versión fijada —no estaba declarado como dependencia—, y
      # `--passWithNoTests` dejaba el job VERDE si no encontraba un solo test.
      - name: Test
        run: npm test

  verify-files:
    name: Verify Required Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required files
        run: |
          set -euo pipefail
          for file in .env-template .env.schema \
                      docker-compose.yml entrypoint.sh; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done
