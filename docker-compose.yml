services:
  payments:
    container_name: $CONTAINER_SLUG
    # Tope de recursos (R13): lo que se desborde adentro muere adentro y no arrastra la
    # máquina. Sin swap. Fijado el 2026-09-10; si una medición pide más, se sube acá.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    working_dir: /code
    restart: always
    build: .
    image: $CONTAINER_NAME
    expose:
      - 80
    extra_hosts:
      - '${HOST_AUTH}'
      - '${HOST_PLATFORM}'
    volumes:
      - .:/code
    command:
      - /bin/sh
      - '-c'
      - './entrypoint.sh'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost/health/ready',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      custom_network:
        ipv4_address: $CONTAINER_IP

networks:
  custom_network:
    name: cubiko
    external: true
