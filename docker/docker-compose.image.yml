# ==========================================================================
# Docker Compose — Despliegue con imagen pre-construida
# ==========================================================================
# Imagen autocontenida desde Artifact Registry. Solo necesita:
#   - .env montado para variables de entorno
#
# Uso en VM:
#   docker compose --env-file .env -f docker/docker-compose.image.yml up -d
# ==========================================================================

services:
  payments:
    container_name: ${CONTAINER_SLUG:-roax-payments}
    image: ${BACKEND_PAYMENTS_IMAGE}
    restart: unless-stopped
    env_file: ../.env
    working_dir: /code
    command: ['./entrypoint.sh']
    expose:
      - 80
    extra_hosts:
      - '${HOST_AUTH}'
      - '${HOST_PLATFORM}'
    volumes:
      - payments-logs:/code/logs
    networks:
      custom_network:
        ipv4_address: ${CONTAINER_IP:-192.160.6.2}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1',
             '--spider', 'http://localhost/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  payments-logs:
    name: payments-logs

networks:
  custom_network:
    name: ${NETWORK_NAME:-cubiko}
    external: true
